<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quest — a calendar for your life goal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
:root {
  /* Perplexity-leaning palette */
  --bg: #FBFAF4;
  --paper: #FFFFFF;
  --ink: #091717;
  --ink-soft: #3a4747;
  --ink-mute: #6b7a7a;
  --line: #E8E5D8;
  --line-soft: #F1EEE3;
  --teal: #20B8CD;
  --teal-ink: #0E7C8B;
  --teal-tint: #E6F6F8;

  /* Activity palette — soft + cute */
  --c-focus:   #F39A7A;  /* goal-critical focus */
  --c-focus-2: #F7B499;
  --c-body:    #9BB76B;  /* workouts */
  --c-mind:    #7FB7A3;  /* meditation */
  --c-people:  #C8A2E0;  /* friends */
  --c-family:  #F1A7C2;  /* family */
  --c-ritual:  #E7C95B;  /* morning routine, rituals */
  --c-meal:    #D8C3A5;  /* meals */
  --c-rest:    #A7B8D6;  /* rest / sleep */

  --shadow-sm: 0 1px 2px rgba(9,23,23,0.04), 0 1px 1px rgba(9,23,23,0.03);
  --shadow-md: 0 6px 18px rgba(9,23,23,0.06), 0 2px 4px rgba(9,23,23,0.04);
  --shadow-lg: 0 18px 40px rgba(9,23,23,0.08), 0 4px 10px rgba(9,23,23,0.05);

  --radius-sm: 8px;
  --radius: 14px;
  --radius-lg: 20px;

  --hour-h: 56px; /* height of one hour row in week/day */
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button { font-family: inherit; cursor: pointer; }
input, button { color: inherit; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

/* ───────────── Layout ───────────── */
.app {
  display: grid;
  grid-template-columns: 280px 1fr;
  min-height: 100vh;
}

/* ───────────── Sidebar ───────────── */
.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 22px 18px;
  border-right: 1px solid var(--line);
  background: linear-gradient(180deg, #FBFAF4 0%, #F6F3E8 100%);
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.brand {
  display: flex; align-items: center; gap: 10px;
  padding: 4px 6px;
}
.brand-mark {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: var(--ink);
  color: var(--bg);
  display: grid; place-items: center;
  box-shadow: var(--shadow-sm);
}
.brand-name {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 600;
  font-size: 20px;
  letter-spacing: -0.01em;
}
.brand-sub { font-size: 11px; color: var(--ink-mute); }

.nav {
  display: flex; flex-direction: column; gap: 2px;
  padding: 6px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px;
  border: 0; background: transparent;
  border-radius: 10px;
  color: var(--ink-soft);
  font-size: 13.5px; font-weight: 500;
  text-align: left;
  transition: background 0.15s ease;
}
.nav-item:hover { background: var(--line-soft); }
.nav-item.active {
  background: var(--teal-tint);
  color: var(--teal-ink);
}
.dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; }

/* Notes card */
.notes {
  margin-top: auto;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
}
.notes::before {
  content: "";
  position: absolute;
  inset: -40% -40% auto auto;
  width: 160px; height: 160px;
  background: radial-gradient(closest-side, rgba(32,184,205,0.18), transparent 70%);
  pointer-events: none;
}
.notes-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.notes-title {
  display: flex; align-items: center; gap: 8px;
  font-weight: 600; font-size: 13px;
}
.spark {
  display: inline-grid; place-items: center;
  width: 22px; height: 22px; border-radius: 7px;
  background: var(--teal); color: white;
  font-size: 12px;
}
.notes-refresh {
  border: 1px solid var(--line);
  background: var(--paper);
  border-radius: 8px;
  width: 26px; height: 26px;
  color: var(--ink-mute);
  font-size: 14px;
}
.notes-refresh:hover { color: var(--teal-ink); border-color: var(--teal); }
.notes-list {
  list-style: none; margin: 0; padding: 0;
  display: flex; flex-direction: column; gap: 8px;
}
.notes-list li {
  font-size: 12.5px;
  color: var(--ink-soft);
  line-height: 1.45;
  padding: 10px 11px;
  background: var(--line-soft);
  border-radius: 10px;
  border-left: 3px solid var(--teal);
}
.notes-list li strong { color: var(--ink); font-weight: 600; }
.notes-foot {
  margin-top: 10px;
  font-size: 11px; color: var(--ink-mute);
  text-align: center;
  letter-spacing: 0.02em;
}

/* ───────────── Main ───────────── */
.main {
  padding: 26px 32px 60px;
  max-width: 1400px;
  width: 100%;
}

/* Goal card */
.goal-card {
  background: linear-gradient(135deg, #FFFFFF 0%, #F5FBFB 100%);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 20px 22px;
  box-shadow: var(--shadow-md);
  position: relative;
  overflow: hidden;
}
.goal-card::after {
  content: "";
  position: absolute;
  right: -60px; top: -60px;
  width: 200px; height: 200px;
  background: radial-gradient(closest-side, rgba(243,154,122,0.20), transparent 70%);
  pointer-events: none;
}
.goal-badge {
  display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
}
.goal-badge-pill {
  font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--teal-ink);
  background: var(--teal-tint);
  padding: 4px 10px;
  border-radius: 999px;
}
.goal-streak {
  font-size: 12px; color: var(--ink-mute);
}
.goal-line { }
.goal-input {
  width: 100%;
  border: 0;
  background: transparent;
  font-family: 'Fraunces', Georgia, serif;
  font-size: 28px;
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--ink);
  padding: 4px 0 8px;
  outline: none;
  border-bottom: 1px dashed transparent;
  transition: border-color .2s ease;
}
.goal-input:focus { border-bottom-color: var(--teal); }

.goal-meta {
  display: flex; align-items: center; justify-content: space-between;
  gap: 20px;
  margin-top: 6px;
  flex-wrap: wrap;
}
.progress { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 240px; }
.progress-track {
  flex: 1;
  height: 8px;
  background: var(--line-soft);
  border-radius: 999px;
  overflow: hidden;
  max-width: 420px;
}
.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--c-focus), var(--teal));
  border-radius: 999px;
  transition: width .4s ease;
}
.progress-label { font-size: 12.5px; color: var(--ink-soft); }
.goal-actions { display: flex; gap: 8px; }
.chip {
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink-soft);
  padding: 7px 12px;
  border-radius: 999px;
  font-size: 12.5px; font-weight: 500;
}
.chip:hover { border-color: var(--ink-mute); }
.chip.primary {
  background: var(--ink); color: var(--bg);
  border-color: var(--ink);
}
.chip.primary:hover { background: #0f2525; }

/* Toolbar */
.toolbar {
  display: flex; align-items: center; justify-content: space-between;
  margin: 22px 0 14px;
  gap: 16px; flex-wrap: wrap;
}
.range { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  border: 1px solid var(--line);
  background: var(--paper);
  width: 34px; height: 34px;
  border-radius: 10px;
  font-size: 18px; line-height: 1; color: var(--ink-soft);
  display: grid; place-items: center;
}
.icon-btn:hover { background: var(--line-soft); }
.today-btn {
  border: 1px solid var(--line);
  background: var(--paper);
  padding: 0 14px; height: 34px;
  border-radius: 10px;
  font-size: 13px; font-weight: 500;
}
.today-btn:hover { background: var(--line-soft); }
.range-label {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 22px; font-weight: 500;
  margin-left: 8px;
  color: var(--ink);
  letter-spacing: -0.01em;
}

.view-switch {
  display: inline-flex;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 4px;
  box-shadow: var(--shadow-sm);
}
.seg {
  border: 0; background: transparent;
  padding: 7px 14px;
  border-radius: 8px;
  font-size: 13px; font-weight: 500;
  color: var(--ink-soft);
}
.seg:hover { color: var(--ink); }
.seg.active {
  background: var(--ink);
  color: var(--bg);
  box-shadow: var(--shadow-sm);
}

/* Canvas */
.canvas {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-md);
}

/* ───────────── Week / Day view ───────────── */
.week {
  display: grid;
  grid-template-columns: 64px repeat(var(--days, 7), 1fr);
  position: relative;
}
.week-head {
  display: contents;
}
.head-cell {
  padding: 14px 10px 12px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, #FDFCF7, #FAF8EE);
  font-size: 12px;
  color: var(--ink-mute);
  text-align: center;
  position: sticky; top: 0; z-index: 5;
}
.head-cell.gutter { border-right: 1px solid var(--line-soft); }
.head-day .dow {
  display: block;
  font-size: 11px; font-weight: 600; letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-mute);
}
.head-day .dnum {
  display: inline-grid; place-items: center;
  width: 30px; height: 30px;
  border-radius: 10px;
  font-family: 'Fraunces', Georgia, serif;
  font-size: 18px; font-weight: 500;
  color: var(--ink);
  margin-top: 4px;
}
.head-day.today .dnum {
  background: var(--ink);
  color: var(--bg);
}
.head-day.today .dow {
  color: var(--teal-ink);
}

.hour-col {
  position: relative;
  border-right: 1px solid var(--line-soft);
}
.hour-col:last-child { border-right: 0; }

.time-gutter {
  position: relative;
  border-right: 1px solid var(--line-soft);
}
.time-gutter .slot {
  height: var(--hour-h);
  font-size: 10.5px;
  color: var(--ink-mute);
  text-align: right;
  padding: 4px 8px 0 0;
  position: relative;
}

.hour-col .slot {
  height: var(--hour-h);
  border-bottom: 1px dashed var(--line-soft);
}
.hour-col .slot:nth-child(even) {
  background: linear-gradient(180deg, rgba(241,238,227,0.25), rgba(241,238,227,0));
}
.hour-col.today {
  background: linear-gradient(180deg, rgba(230,246,248,0.5), rgba(230,246,248,0.0) 80%);
}

/* Blocks */
.block {
  position: absolute;
  left: 6px; right: 6px;
  border-radius: 12px;
  padding: 8px 10px;
  font-size: 11.5px;
  color: #1a2b2a;
  background: var(--block-bg, #eee);
  border: 1px solid rgba(0,0,0,0.04);
  box-shadow: 0 1px 2px rgba(9,23,23,0.05);
  overflow: hidden;
  line-height: 1.25;
  cursor: default;
  transition: transform .12s ease, box-shadow .2s ease;
}
.block:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
  z-index: 3;
}
.block .b-title {
  font-weight: 600;
  font-size: 12px;
  color: #1a2b2a;
  display: flex; align-items: center; gap: 6px;
}
.block .b-emoji { font-size: 12px; }
.block .b-time {
  font-size: 10.5px;
  color: rgba(9,23,23,0.55);
  margin-top: 2px;
}
.block .b-tag {
  display: inline-block;
  margin-top: 6px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: rgba(9,23,23,0.55);
  background: rgba(255,255,255,0.6);
  padding: 2px 6px;
  border-radius: 6px;
}

/* Focus (goal-critical) block — brighter and bigger visual weight */
.block.focus {
  background: linear-gradient(135deg, #FFB491 0%, #F08160 100%);
  color: #3a1a0d;
  border: 1px solid rgba(255,255,255,0.4);
  box-shadow:
    0 10px 24px rgba(240,129,96,0.28),
    0 2px 4px rgba(240,129,96,0.25),
    inset 0 1px 0 rgba(255,255,255,0.5);
}
.block.focus .b-title { color: #2a0e05; font-size: 13px; }
.block.focus .b-time  { color: rgba(42,14,5,0.7); }
.block.focus .b-tag {
  background: rgba(255,255,255,0.55);
  color: #7a2b14;
}
.block.focus::before {
  content: "★";
  position: absolute;
  top: 8px; right: 10px;
  font-size: 11px;
  color: #fff;
  opacity: 0.9;
  text-shadow: 0 1px 2px rgba(0,0,0,0.15);
}

/* Colored block variants (background comes from --block-bg inline,
   this is a soft tint helper for consistent feel) */
.block.body   { --block-bg: #E1ECC9; }
.block.mind   { --block-bg: #D2E7DC; }
.block.people { --block-bg: #E9DAF4; }
.block.family { --block-bg: #F8D7E5; }
.block.ritual { --block-bg: #F7E8B2; }
.block.meal   { --block-bg: #EEE2CC; }
.block.rest   { --block-bg: #DCE3EF; }

/* Now line */
.now-line {
  position: absolute;
  left: 64px; right: 0;
  height: 0;
  pointer-events: none;
  z-index: 4;
}
.now-line .bar {
  position: absolute;
  left: 0; right: 0; top: 0;
  height: 2px;
  background: linear-gradient(90deg, #FF5E5E, #FF8A4C);
  box-shadow: 0 0 0 1px rgba(255,94,94,0.25), 0 2px 8px rgba(255,94,94,0.35);
  border-radius: 2px;
}
.now-line .pill {
  position: absolute;
  left: -56px; top: -10px;
  font-size: 10.5px;
  font-weight: 600;
  color: white;
  background: #FF5E5E;
  padding: 3px 7px;
  border-radius: 6px;
  box-shadow: 0 2px 6px rgba(255,94,94,0.35);
}
.now-line .bead {
  position: absolute;
  left: -5px; top: -4px;
  width: 10px; height: 10px;
  border-radius: 999px;
  background: #FF5E5E;
  box-shadow: 0 0 0 3px rgba(255,94,94,0.2);
}

/* ───────────── Month view ───────────── */
.month {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
}
.month .m-head {
  padding: 10px 12px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-mute);
  background: linear-gradient(180deg, #FDFCF7, #FAF8EE);
  border-bottom: 1px solid var(--line);
  text-align: left;
}
.month .m-cell {
  min-height: 112px;
  border-right: 1px solid var(--line-soft);
  border-bottom: 1px solid var(--line-soft);
  padding: 8px 10px;
  background: var(--paper);
  display: flex; flex-direction: column; gap: 6px;
  position: relative;
}
.month .m-cell.other { background: #FCFAF2; color: var(--ink-mute); }
.month .m-cell.today { background: var(--teal-tint); }
.month .m-num {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 15px;
  font-weight: 500;
}
.month .m-cell.today .m-num { color: var(--teal-ink); }
.m-pills { display: flex; flex-direction: column; gap: 3px; }
.m-pill {
  font-size: 10.5px;
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--block-bg, #eee);
  color: #1a2b2a;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.m-pill.focus {
  background: linear-gradient(90deg, #FFB491, #F08160);
  color: #fff;
  font-weight: 600;
}

/* ───────────── 12-Week view ───────────── */
.twelve {
  padding: 18px 22px 26px;
}
.twelve-head {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 14px;
}
.twelve-title {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 18px; font-weight: 500;
}
.twelve-sub { font-size: 12px; color: var(--ink-mute); }
.twelve-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.w-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  background: linear-gradient(180deg, #FFFFFF, #FBF9EF);
  position: relative;
  overflow: hidden;
  min-height: 128px;
}
.w-card.current {
  border-color: var(--teal);
  background: linear-gradient(180deg, #F4FBFC, #E6F6F8);
  box-shadow: 0 6px 16px rgba(32,184,205,0.14);
}
.w-card.done { opacity: 0.7; }
.w-top {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
}
.w-num {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 24px; font-weight: 600;
  line-height: 1;
}
.w-range { font-size: 11px; color: var(--ink-mute); }
.w-milestone {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  margin-bottom: 10px;
  min-height: 34px;
}
.w-bar {
  height: 6px;
  background: var(--line-soft);
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 6px;
}
.w-bar > span {
  display: block; height: 100%;
  background: linear-gradient(90deg, var(--c-focus), var(--teal));
}
.w-meta { font-size: 11px; color: var(--ink-mute); }

/* Responsive nudges */
@media (max-width: 1100px) {
  .app { grid-template-columns: 240px 1fr; }
  .main { padding: 20px; }
}
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; }
  .week { --days: 7; }
}

</style>
</head>
<body>
  <div class="app">
    <!-- ───────────── Sidebar ───────────── -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2 L15 9 L22 9.5 L16.5 14 L18.5 21 L12 17.5 L5.5 21 L7.5 14 L2 9.5 L9 9 Z" />
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-name">Quest</div>
          <div class="brand-sub">your weekly co-pilot</div>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active">
          <span class="dot" style="background:#20B8CD"></span>Today
        </button>
        <button class="nav-item">
          <span class="dot" style="background:#F39A7A"></span>Focus work
        </button>
        <button class="nav-item">
          <span class="dot" style="background:#9BB76B"></span>Body &amp; mind
        </button>
        <button class="nav-item">
          <span class="dot" style="background:#C8A2E0"></span>People
        </button>
        <button class="nav-item">
          <span class="dot" style="background:#E7C95B"></span>Rituals
        </button>
      </nav>

      <!-- AI Notes -->
      <section class="notes" aria-label="AI recommendations">
        <div class="notes-head">
          <div class="notes-title">
            <span class="spark" aria-hidden="true">✦</span>
            AI for today
          </div>
          <button class="notes-refresh" id="refreshNotes" title="New ideas">↻</button>
        </div>
        <ul class="notes-list" id="notesList"></ul>
        <div class="notes-foot">focused on your life goal</div>
      </section>
    </aside>

    <!-- ───────────── Main ───────────── -->
    <main class="main">
      <!-- Goal bar -->
      <section class="goal-card">
        <div class="goal-badge">
          <span class="goal-badge-pill">life goal</span>
          <span class="goal-streak" id="goalStreak">🔥 12-day streak</span>
        </div>
        <div class="goal-line">
          <label for="goalInput" class="sr-only">Your life goal</label>
          <input
            id="goalInput"
            class="goal-input"
            type="text"
            value="Find a dream product design job."
            spellcheck="false"
          />
        </div>
        <div class="goal-meta">
          <div class="progress">
            <div class="progress-track">
              <div class="progress-bar" id="goalProgress" style="width: 42%"></div>
            </div>
            <span class="progress-label"><strong>42%</strong> toward goal · week 5 of 12</span>
          </div>
          <div class="goal-actions">
            <button class="chip">+ milestone</button>
            <button class="chip primary">focus mode</button>
          </div>
        </div>
      </section>

      <!-- Toolbar -->
      <section class="toolbar">
        <div class="range">
          <button class="icon-btn" id="prev" title="Previous">‹</button>
          <button class="today-btn" id="todayBtn">Today</button>
          <button class="icon-btn" id="next" title="Next">›</button>
          <div class="range-label" id="rangeLabel">—</div>
        </div>

        <div class="view-switch" role="tablist" aria-label="Calendar view">
          <button class="seg" data-view="day">Day</button>
          <button class="seg active" data-view="week">Week</button>
          <button class="seg" data-view="month">Month</button>
          <button class="seg" data-view="twelve">12-Week</button>
        </div>
      </section>

      <!-- Calendar surface -->
      <section class="canvas" id="canvas">
        <!-- views render here -->
      </section>
    </main>
  </div>

  <script>
/* ───────────── Quest · calendar app ───────────── */

const HOUR_H = 56;        // keep in sync with --hour-h in CSS
const DAY_START = 6;      // 6am
const DAY_END = 23;       // 11pm (rows: 6..22, 17 rows)
const DAYS_IN_WEEK = 7;

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

/* ---------- Date helpers ---------- */
const pad2 = (n) => String(n).padStart(2, '0');
const sameDay = (a, b) =>
  a.getFullYear() === b.getFullYear() &&
  a.getMonth() === b.getMonth() &&
  a.getDate() === b.getDate();

function startOfWeek(date) {
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - d.getDay()); // Sunday = 0
  return d;
}
function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}
function fmtMonthDay(d) {
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
function fmtHour(h) {
  const am = h < 12;
  const hr = ((h + 11) % 12) + 1;
  return `${hr} ${am ? 'AM' : 'PM'}`;
}

/* ---------- Recurring schedule template ----------
 * dows: 0=Sun … 6=Sat
 * t/e : decimal hours (9.5 = 9:30)
 * type: focus | body | mind | people | family | ritual | meal | rest
 */
const SCHEDULE_TEMPLATE = [
  // Daily rituals
  { title: 'Morning routine',     emoji: '☕', type: 'ritual', t: 7,    e: 8,    dows: [0,1,2,3,4,5,6], tag: 'ritual' },
  { title: 'Meditation',          emoji: '🧘', type: 'mind',   t: 8,    e: 8.5,  dows: [1,2,3,4,5],     tag: 'calm'   },
  { title: 'Lunch',               emoji: '🥗', type: 'meal',   t: 13,   e: 14,   dows: [0,1,2,3,4,5,6], tag: 'meal'   },
  { title: 'Dinner',              emoji: '🍲', type: 'meal',   t: 19,   e: 20,   dows: [0,1,2,3,4,5,6], tag: 'meal'   },
  { title: 'Wind down · read',    emoji: '📖', type: 'rest',   t: 22,   e: 23,   dows: [0,1,2,3,4,5,6], tag: 'rest'   },

  // Body
  { title: 'Run · 5k',            emoji: '🏃', type: 'body',   t: 6.5,  e: 7,    dows: [1,3,5], tag: 'body' },
  { title: 'Strength training',   emoji: '🏋️', type: 'body',   t: 17.5, e: 18.5, dows: [2,4],   tag: 'body' },
  { title: 'Long walk',           emoji: '🌿', type: 'body',   t: 10,   e: 11,   dows: [6],     tag: 'body' },

  // Focus blocks — goal-critical, 3–4h
  { title: 'Prep résumé & portfolio', emoji: '✍️', type: 'focus', t: 9,   e: 12.5, dows: [1],   tag: 'goal', focus: true },
  { title: 'Practice case study',     emoji: '🎤', type: 'focus', t: 9,   e: 13,   dows: [2],   tag: 'goal', focus: true },
  { title: 'Apply to 10 roles',       emoji: '🚀', type: 'focus', t: 9.5, e: 13,   dows: [3],   tag: 'goal', focus: true },
  { title: 'Portfolio case write-up', emoji: '📐', type: 'focus', t: 9,   e: 12.5, dows: [4],   tag: 'goal', focus: true },
  { title: 'Network & coffee chats',  emoji: '☕', type: 'focus', t: 10,  e: 13,   dows: [5],   tag: 'goal', focus: true },

  // People
  { title: 'Design book club',    emoji: '📚', type: 'people', t: 19.5, e: 21,   dows: [3], tag: 'friends' },
  { title: 'Friends · dinner',    emoji: '🍜', type: 'people', t: 19,   e: 21.5, dows: [5], tag: 'friends' },
  { title: 'Board game night',    emoji: '🎲', type: 'people', t: 20,   e: 22,   dows: [6], tag: 'friends' },

  // Family
  { title: 'Family brunch',       emoji: '🥞', type: 'family', t: 11,   e: 13,   dows: [0], tag: 'family' },
  { title: 'Call parents',        emoji: '📞', type: 'family', t: 18,   e: 18.5, dows: [0], tag: 'family' },
  { title: 'Siblings video call', emoji: '💬', type: 'family', t: 20,   e: 21,   dows: [2], tag: 'family' },
];

/* ---------- State ---------- */
const state = {
  today: new Date(),   // real wall clock
  cursor: new Date(),  // reference date for the visible range
  view: 'week',
};

/* ---------- Expand schedule for a given date ---------- */
function eventsFor(date) {
  const dow = date.getDay();
  return SCHEDULE_TEMPLATE
    .filter((e) => e.dows.includes(dow))
    .map((e) => ({ ...e, date: new Date(date) }));
}

/* ───────────── Renderers ───────────── */

function renderWeek(root, anchor, opts = {}) {
  const days = opts.days ?? DAYS_IN_WEEK;
  const start = opts.start ?? startOfWeek(anchor);
  const daysArr = Array.from({ length: days }, (_, i) => addDays(start, i));

  // Scaffold
  root.innerHTML = '';
  const week = document.createElement('div');
  week.className = 'week';
  week.style.setProperty('--days', days);

  // Header row
  const hdr = document.createElement('div');
  hdr.className = 'week-head';
  hdr.appendChild(headCell('', 'head-cell gutter'));
  daysArr.forEach((d) => {
    const isToday = sameDay(d, state.today);
    const cell = document.createElement('div');
    cell.className = 'head-cell head-day' + (isToday ? ' today' : '');
    const dow = d.toLocaleDateString(undefined, { weekday: 'short' });
    cell.innerHTML = `<span class="dow">${dow}</span><span class="dnum">${d.getDate()}</span>`;
    hdr.appendChild(cell);
  });
  week.appendChild(hdr);

  // Time gutter
  const gutter = document.createElement('div');
  gutter.className = 'time-gutter';
  for (let h = DAY_START; h <= DAY_END; h++) {
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.textContent = fmtHour(h);
    gutter.appendChild(slot);
  }
  week.appendChild(gutter);

  // Day columns
  daysArr.forEach((d) => {
    const col = document.createElement('div');
    col.className = 'hour-col';
    if (sameDay(d, state.today)) col.classList.add('today');
    for (let h = DAY_START; h <= DAY_END; h++) {
      const slot = document.createElement('div');
      slot.className = 'slot';
      col.appendChild(slot);
    }
    // Render blocks
    eventsFor(d).forEach((ev) => col.appendChild(renderBlock(ev)));
    week.appendChild(col);
  });

  root.appendChild(week);

  // Now line (only if today is visible)
  const todayInRange = daysArr.some((d) => sameDay(d, state.today));
  if (todayInRange) addNowLine(week, daysArr);
}

function headCell(html, cls) {
  const c = document.createElement('div');
  c.className = cls;
  c.innerHTML = html;
  return c;
}

function renderBlock(ev) {
  const el = document.createElement('div');
  el.className = `block ${ev.type}` + (ev.focus ? ' focus' : '');
  const top = (ev.t - DAY_START) * HOUR_H;
  const height = Math.max(28, (ev.e - ev.t) * HOUR_H - 4);
  el.style.top = `${top + 2}px`;
  el.style.height = `${height}px`;

  const timeStr = `${fmtTime(ev.t)} – ${fmtTime(ev.e)}`;
  el.innerHTML = `
    <div class="b-title"><span class="b-emoji">${ev.emoji}</span>${ev.title}</div>
    <div class="b-time">${timeStr}</div>
    ${ev.tag ? `<span class="b-tag">${ev.tag}</span>` : ''}
  `;
  return el;
}

function fmtTime(h) {
  const hr = Math.floor(h);
  const m = Math.round((h - hr) * 60);
  const am = hr < 12;
  const hh = ((hr + 11) % 12) + 1;
  return `${hh}:${pad2(m)} ${am ? 'AM' : 'PM'}`;
}

function addNowLine(weekRoot, daysArr) {
  const now = new Date();
  const hrs = now.getHours() + now.getMinutes() / 60;
  if (hrs < DAY_START || hrs > DAY_END + 1) return;
  const top =
    // header height (~60px) isn't part of column, but now-line is absolute to .week
    // easier: absolute-position inside the today column instead
    null;

  const todayIdx = daysArr.findIndex((d) => sameDay(d, state.today));
  if (todayIdx < 0) return;

  const cols = weekRoot.querySelectorAll('.hour-col');
  const col = cols[todayIdx];
  if (!col) return;
  const bar = document.createElement('div');
  bar.className = 'now-line';
  bar.style.left = '0';
  bar.style.right = '0';
  bar.style.position = 'absolute';
  bar.style.top = `${(hrs - DAY_START) * HOUR_H}px`;
  bar.innerHTML = `
    <div class="bead"></div>
    <div class="pill">${now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</div>
    <div class="bar"></div>
  `;
  col.style.position = 'relative';
  col.appendChild(bar);
}

/* ---------- Month ---------- */
function renderMonth(root, anchor) {
  const first = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
  const gridStart = startOfWeek(first);
  root.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'month';

  const heads = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  heads.forEach((h) => {
    const el = document.createElement('div');
    el.className = 'm-head';
    el.textContent = h;
    wrap.appendChild(el);
  });

  for (let i = 0; i < 42; i++) {
    const d = addDays(gridStart, i);
    const inMonth = d.getMonth() === anchor.getMonth();
    const isToday = sameDay(d, state.today);
    const cell = document.createElement('div');
    cell.className = 'm-cell' + (inMonth ? '' : ' other') + (isToday ? ' today' : '');
    cell.innerHTML = `<div class="m-num">${d.getDate()}</div>`;

    const pills = document.createElement('div');
    pills.className = 'm-pills';
    const evs = eventsFor(d).filter((e) => e.focus || e.type === 'people' || e.type === 'family');
    evs.slice(0, 3).forEach((e) => {
      const p = document.createElement('div');
      p.className = 'm-pill ' + e.type + (e.focus ? ' focus' : '');
      p.textContent = `${e.emoji} ${e.title}`;
      pills.appendChild(p);
    });
    cell.appendChild(pills);
    wrap.appendChild(cell);
  }
  root.appendChild(wrap);
}

/* ---------- 12-Week ---------- */
function renderTwelve(root, anchor) {
  root.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'twelve';

  const currentWeekIndex = 4; // week 5 of 12 → 0-indexed 4, matches progress bar

  const milestones = [
    'Audit portfolio · list target roles',
    'Refresh résumé & LinkedIn',
    'Draft 3 case studies',
    'Polish hero case · seek feedback',
    'Apply to 10 roles (week 1)',         // current
    'Practice case study presentation',
    'First mock interviews',
    'Apply to 10 roles (week 2)',
    'Whiteboard & portfolio deep-dives',
    'Apply to 10 roles (week 3) · follow-ups',
    'Negotiation prep · references',
    'Offers · pick your favourite 🎉',
  ];

  const head = document.createElement('div');
  head.className = 'twelve-head';
  head.innerHTML = `
    <div class="twelve-title">12-Week Quest</div>
    <div class="twelve-sub">a season-long sprint toward your life goal</div>
  `;
  wrap.appendChild(head);

  const grid = document.createElement('div');
  grid.className = 'twelve-grid';

  const seasonStart = addDays(startOfWeek(state.today), -currentWeekIndex * 7);

  for (let i = 0; i < 12; i++) {
    const wStart = addDays(seasonStart, i * 7);
    const wEnd = addDays(wStart, 6);
    const card = document.createElement('div');
    card.className = 'w-card' +
      (i < currentWeekIndex ? ' done' : '') +
      (i === currentWeekIndex ? ' current' : '');

    const pct = i < currentWeekIndex ? 100
              : i === currentWeekIndex ? 42
              : 0;

    card.innerHTML = `
      <div class="w-top">
        <div class="w-num">W${i + 1}</div>
        <div class="w-range">${fmtMonthDay(wStart)} – ${fmtMonthDay(wEnd)}</div>
      </div>
      <div class="w-milestone">${milestones[i]}</div>
      <div class="w-bar"><span style="width:${pct}%"></span></div>
      <div class="w-meta">${pct}% · ${i === currentWeekIndex ? 'in progress' : i < currentWeekIndex ? 'complete' : 'upcoming'}</div>
    `;
    grid.appendChild(card);
  }
  wrap.appendChild(grid);
  root.appendChild(wrap);
}

/* ---------- Range label ---------- */
function rangeLabelText() {
  const d = state.cursor;
  if (state.view === 'day') {
    return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  }
  if (state.view === 'week') {
    const s = startOfWeek(d);
    const e = addDays(s, 6);
    const sameMonth = s.getMonth() === e.getMonth();
    return sameMonth
      ? `${s.toLocaleDateString(undefined, { month: 'long' })} ${s.getDate()} – ${e.getDate()}, ${e.getFullYear()}`
      : `${fmtMonthDay(s)} – ${fmtMonthDay(e)}, ${e.getFullYear()}`;
  }
  if (state.view === 'month') {
    return d.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  }
  return `12-Week Quest`;
}

/* ---------- Dispatcher ---------- */
function render() {
  const canvas = $('#canvas');
  $('#rangeLabel').textContent = rangeLabelText();

  $$('.seg').forEach((b) => b.classList.toggle('active', b.dataset.view === state.view));

  if (state.view === 'day') {
    const dayStart = new Date(state.cursor);
    dayStart.setHours(0, 0, 0, 0);
    renderWeek(canvas, state.cursor, { days: 1, start: dayStart });
  } else if (state.view === 'week') {
    renderWeek(canvas, state.cursor);
  } else if (state.view === 'month') {
    renderMonth(canvas, state.cursor);
  } else {
    renderTwelve(canvas, state.cursor);
  }
}

/* ---------- Navigation ---------- */
function nav(dir) {
  const step = dir === 'next' ? 1 : -1;
  if (state.view === 'day')   state.cursor = addDays(state.cursor, step);
  else if (state.view === 'week') state.cursor = addDays(state.cursor, 7 * step);
  else if (state.view === 'month') {
    state.cursor = new Date(state.cursor.getFullYear(), state.cursor.getMonth() + step, 1);
  } else {
    state.cursor = addDays(state.cursor, 7 * 12 * step);
  }
  render();
}

/* ---------- AI notes (rotating stock set) ---------- */
const NOTE_SETS = [
  [
    '<strong>Your 9–1 focus block</strong> is prime case-study prep time — silence notifications.',
    'Aim for <strong>3 applications</strong> before lunch; batch follow-ups for Thursday.',
    'End the day by logging one interview question you practiced today.',
  ],
  [
    'Review the <strong>feedback from last week</strong> before tomorrow’s portfolio polish block.',
    'Draft a 30-sec self-intro; record it once and iterate.',
    'Message 2 designers on LinkedIn while your morning coffee brews.',
  ],
  [
    'Your résumé section <strong>“impact metrics”</strong> still reads vague — rewrite two bullets.',
    'Pair today’s case study practice with a 10-min walk afterward to consolidate.',
    'Sleep is part of the plan — wind-down starts at 10 PM.',
  ],
];
let noteIdx = 0;
function renderNotes() {
  const list = $('#notesList');
  list.innerHTML = NOTE_SETS[noteIdx % NOTE_SETS.length]
    .map((n) => `<li>${n}</li>`).join('');
}

/* ---------- Init ---------- */
function init() {
  // view toggles
  $$('.seg').forEach((b) => b.addEventListener('click', () => {
    state.view = b.dataset.view;
    render();
  }));

  $('#prev').addEventListener('click', () => nav('prev'));
  $('#next').addEventListener('click', () => nav('next'));
  $('#todayBtn').addEventListener('click', () => {
    state.cursor = new Date();
    render();
  });

  $('#refreshNotes').addEventListener('click', () => {
    noteIdx++;
    renderNotes();
  });

  renderNotes();
  render();

  // Keep the now-line + visible ranges fresh
  setInterval(() => {
    // re-render current view so the now-line moves with real time
    render();
  }, 60 * 1000);
}

document.addEventListener('DOMContentLoaded', init);

</script>
</body>
